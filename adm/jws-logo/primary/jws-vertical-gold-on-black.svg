<?xml version="1.0" encoding="UTF-8"?>
<!-- James Webb Studio - Logo Primário Vertical (Gold on Black) -->
<!-- Geometria: R=24px, G=3.6px (15% de R), D=R√3+G=45.1px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300&amp;display=swap');
      .logo-text { font-family: 'Inter', sans-serif; font-weight: 300; fill: #C5A059; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#000000"/>

  <!-- Hexagon cluster: 3 hexagons, flat-top, R=24, G=3.6 -->
  <!-- D = 24 * 1.732 + 3.6 = 45.1 -->
  <!-- Centroide em (300, 130) -->
  <!-- Hex1 (topo):       cx=300,    cy=130 - 45.1/√3 = 130 - 26.03 = 103.97 -->
  <!-- Hex2 (base esq.):  cx=300-22.55, cy=130 + 13.02 = 143.02 -->
  <!-- Hex3 (base dir.):  cx=300+22.55, cy=130 + 13.02 = 143.02 -->

  <!-- Hexágono flat-top: 6 pontos a partir do topo-direito, sentido horário -->
  <!-- Para centro (cx,cy) e raio R: -->
  <!-- p0 = (cx+R*cos(0°), cy+R*sin(0°)) = (cx+R, cy) -->
  <!-- p1 = (cx+R*cos(60°), cy+R*sin(60°)) = (cx+R/2, cy+R*√3/2) -->
  <!-- etc. Mas flat-top rota 30°: -->
  <!-- p0 = (cx+R*cos(30°), cy-R*sin(30°)) = (cx+20.78, cy-12) -->

  <!-- Hex 1 (topo) - centro (300, 104) -->
  <polygon points="320.78,92 320.78,116 300,128 279.22,116 279.22,92 300,80"
           fill="none" stroke="#C5A059" stroke-width="1.5"/>

  <!-- Hex 2 (base esquerda) - centro (277.45, 143) -->
  <polygon points="298.23,131 298.23,155 277.45,167 256.67,155 256.67,131 277.45,119"
           fill="none" stroke="#C5A059" stroke-width="1.5"/>

  <!-- Hex 3 (base direita) - centro (322.55, 143) -->
  <polygon points="343.33,131 343.33,155 322.55,167 301.77,155 301.77,131 322.55,119"
           fill="none" stroke="#C5A059" stroke-width="1.5"/>

  <!-- JAMES WEBB -->
  <text x="300" y="230" text-anchor="middle" class="logo-text"
        font-size="32" letter-spacing="10">JAMES WEBB</text>

  <!-- STUDIO -->
  <text x="300" y="265" text-anchor="middle" class="logo-text"
        font-size="17" letter-spacing="14">STUDIO</text>
</svg>

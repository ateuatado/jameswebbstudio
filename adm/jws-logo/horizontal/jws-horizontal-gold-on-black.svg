<?xml version="1.0" encoding="UTF-8"?>
<!-- James Webb Studio - Logo Horizontal (Gold on Black) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300&amp;display=swap');
      .logo-text { font-family: 'Inter', sans-serif; font-weight: 300; fill: #C5A059; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="120" fill="#000000"/>

  <!-- Hexagon cluster (R=14, G=2.1, scaled down) -->
  <!-- Hex 1 (topo) - centro (45, 37) -->
  <polygon points="57.13,28.7 57.13,45.3 45,53.6 32.87,45.3 32.87,28.7 45,20.4"
           fill="none" stroke="#C5A059" stroke-width="1.2"/>

  <!-- Hex 2 (base esquerda) - centro (31.82, 60) -->
  <polygon points="43.95,51.7 43.95,68.3 31.82,76.6 19.69,68.3 19.69,51.7 31.82,43.4"
           fill="none" stroke="#C5A059" stroke-width="1.2"/>

  <!-- Hex 3 (base direita) - centro (58.18, 60) -->
  <polygon points="70.31,51.7 70.31,68.3 58.18,76.6 46.05,68.3 46.05,51.7 58.18,43.4"
           fill="none" stroke="#C5A059" stroke-width="1.2"/>

  <!-- JAMES WEBB -->
  <text x="120" y="52" class="logo-text" text-anchor="start"
        font-size="28" letter-spacing="8">JAMES WEBB</text>

  <!-- STUDIO -->
  <text x="122" y="78" class="logo-text" text-anchor="start"
        font-size="14" letter-spacing="12">STUDIO</text>
</svg>
